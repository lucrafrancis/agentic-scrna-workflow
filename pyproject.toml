[project]
name = "agentic-scrna-workflow"
version = "0.1.0"
description = "An agentic LLM workflow that autonomously drives a single-cell RNA-seq analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "scanpy>=1.10",
    "anndata>=0.10",
    "scvi-tools>=1.1",
    "celltypist>=1.6",
    "leidenalg>=0.10",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
